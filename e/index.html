<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nonogram — Event</title>
<meta name="robots" content="noindex">
<!-- With the app installed, iOS opens /e/<id> in the app directly (universal link) and this page
     is never fetched. -->
<meta name="apple-itunes-app" content="app-id=6795158972">
<style>
  :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --accent: #0071e3; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --fg: #f5f5f7; --muted: #a1a1a6; --accent: #2997ff; --card: #1c1c1e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--fg); padding: 16px;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { background: var(--card); border-radius: 20px; padding: 32px 24px; max-width: 420px;
         width: 100%; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
          font-weight: 600; padding: 14px 28px; border-radius: 14px; }
</style>
</head>
<body>
<main>
  <img src="/assets/icon-1024.png" alt="" width="72" height="72">
  <h1>Open in Nonogram</h1>
  <p>This event lives in Nonogram on your iPhone or iPad.</p>
  <a class="btn" id="store" href="https://apps.apple.com/app/id6795158972?pt=96176867&amp;ct=event&amp;mt=8">Get the app</a>
</main>
<script>
  // The id is the path segment after /e/; anything outside ^[a-z0-9-]{1,40}$ falls back to the
  // plain "event" campaign token.
  (function () {
    var m = location.pathname.match(/^\/e\/([^\/]+)\/?$/);
    var id = m ? m[1] : "";
    var ct = /^[a-z0-9-]{1,40}$/.test(id) ? "event-" + id : "event";
    var url = "https://apps.apple.com/app/id6795158972?pt=96176867&ct=" + encodeURIComponent(ct) + "&mt=8";
    document.getElementById("store").href = url;
    setTimeout(function () { location.replace(url); }, 1500);
  })();
</script>
</body>
</html>
